<!doctype html>
<html lang="de" data-marke="fidelia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIDELIA Form – Briefe einfach erklärt</title>
<meta name="description" content="Fotografier einen komplizierten Brief – FIDELIA Form erklärt in einfacher Sprache, worum es geht, was du tun musst und bis wann. Alles bleibt auf deinem Gerät.">
<meta name="theme-color" content="#1e3a8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Form">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<link rel="stylesheet" href="../shared/kw.css">
<style>:root{--app:#1e3a8a;--app-soft:rgba(30,58,138,.14)}@media (prefers-color-scheme:dark){:root{--app-soft:rgba(96,130,230,.18)}}</style>
<style>
.klein{font-size:.85rem}
.hallo{text-align:center;padding:24px 10px 6px}
.hallo .gross{font-size:4rem}
.hallo h2{margin:8px 0 6px}
.hallo p{color:var(--muted);max-width:420px;margin:0 auto 14px}
.hinweis,.warnung{padding:12px 14px;margin:0 0 14px;font-size:.92rem}
.warnung{border-color:rgba(255,138,60,.6);background:rgba(255,138,60,.1)}
.knoepfe{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:0 auto}
.knoepfe .btn{padding:14px;cursor:pointer}
.btn.gross{font-size:1.05rem}
.liste{display:flex;flex-direction:column;gap:8px}
.eintrag{display:flex;gap:12px;align-items:center;padding:11px 13px;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer}
.eintrag.statisch{cursor:default}
.eintrag.frist{border-color:var(--accent)}
.eintrag .i{font-size:1.4rem;flex:none}
.eintrag .mitte{flex:1;min-width:0}
.eintrag .mitte b{display:block}
.eintrag .mitte small{color:var(--muted);overflow-wrap:anywhere}
.eintrag .rechts{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;color:var(--muted)}
.titel{margin:14px 0 4px}
.brief{min-height:260px;font-size:.95rem;line-height:1.5;margin-top:8px}
.arbeitet{text-align:center;padding:30px 16px;margin-top:20px}
.dreh{width:38px;height:38px;border:4px solid var(--app-soft);border-top-color:var(--app);border-radius:50%;margin:0 auto 14px;animation:dreh .9s linear infinite}
@keyframes dreh{to{transform:rotate(360deg)}}
.balken{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:12px 0 6px}
.balken span{display:block;height:100%;width:0;background:var(--app);transition:width .3s}
.ki,.check{padding:16px;margin-top:12px}
.ki h3,.check h3{margin:0 0 8px}
.check p{margin:10px 0 6px}
.check small{color:var(--muted)}
.antwort h4{margin:14px 0 4px;color:var(--app);font-size:1rem}
@media (prefers-color-scheme:dark){.antwort h4{color:#8fb0ff}}
.antwort ul{margin:4px 0;padding-left:20px}
.antwort li{margin:3px 0}
.chip{margin:2px 4px 2px 0}
</style>
</head>
<body>
<script src="../shared/intro.js"></script>
<header class="kw-bar">
  <a class="kw-home" href="../" aria-label="Zurück zur Startseite der OMNIVIA Group"><img src="../shared/marken/omnivia-zeichen.webp" alt="" width="40" height="21" style="width:40px;height:auto;display:block"></a>
  <h1>FIDELIA Form</h1>
  <button class="kw-install" id="kwInstall" type="button" hidden>Als App installieren</button>
</header>
<main class="kw-main"><div id="ansicht"></div></main>
<footer class="kw-foot"><span>Eine App von <a href="../apps/">FIDELIA Digital</a> · Fotos und Texte bleiben auf deinem Gerät · Nur eine Hilfe, keine Beratung.</span></footer>
<script src="../shared/kw.js"></script>
<script type="module" src="form.js"></script>
</body>
</html>
