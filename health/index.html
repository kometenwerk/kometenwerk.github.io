<!doctype html>
<html lang="de" data-marke="fidelia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIDELIA Health – dein privates Tagebuch</title>
<meta name="description" content="Schlaf, Bewegung, Stimmung und Beschwerden – ein privates Tagebuch, mit PIN verschlüsselt und nur auf deinem Gerät. Ohne Kalorien, ohne Werbung.">
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<link rel="stylesheet" href="../shared/kw.css">
<style>:root{--app:#2f6f4f;--app-soft:rgba(47,111,79,.15)}</style>
<style>
.klein{font-size:.85rem}
.pin-karte{max-width:380px;margin:30px auto;padding:26px 20px;text-align:center}
.pin-karte .gross{font-size:3.4rem}
.pin-karte h2{margin:8px 0 6px}
.pin-karte p{color:var(--muted)}
.pin{text-align:center;font-size:1.5rem;letter-spacing:.4em;margin:6px 0}
.pin-karte .btn.primary{width:100%;padding:13px;margin-top:8px}
.link{border:0;background:transparent;color:var(--app);text-decoration:underline;cursor:pointer;padding:0;font-weight:600}
.wackel{animation:wackel .4s}
@keyframes wackel{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tagwahl{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px}
.tagwahl b{font-size:1.15rem}
.kw-ico2{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.4rem;cursor:pointer}
.kw-ico2:disabled{opacity:.35;cursor:default}
.block{padding:14px;margin:0 0 10px}
.block h3{margin:0 0 10px;font-size:1rem}
.stimmung{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stimmung button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.stimmung span{font-size:1.7rem}
.stimmung small{font-size:.72rem;color:var(--muted)}
.stimmung button[aria-pressed="true"]{border-color:var(--app);background:var(--app-soft)}
.regler{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:10px}
.regler button{width:46px;height:46px;border-radius:50%;border:0;background:var(--app);color:#fff;font-size:1.4rem;cursor:pointer}
.regler b{min-width:110px;text-align:center;font-size:1.3rem}
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.chips2 button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:.9rem}
.chips2 button[aria-pressed="true"]{background:var(--app);border-color:var(--app);color:#fff;font-weight:600}
.glaeser{display:flex;gap:4px;flex-wrap:wrap}
.glaeser button{font-size:1.6rem;border:0;background:transparent;cursor:pointer;filter:grayscale(1);opacity:.35;padding:2px}
.glaeser button[aria-pressed="true"]{filter:none;opacity:1}
.tipp{background:rgba(255,138,60,.12);border-radius:10px;padding:8px 10px;font-size:.88rem;margin:10px 0 0}
.kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 10px}
.kachel{padding:12px 14px}
.kachel small{color:var(--muted);display:block;font-size:.78rem}
.kachel b{font-size:1.05rem}
.saeulen{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;height:130px;align-items:end}
.saeulen .s{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.saeulen .s span{width:100%;border-radius:6px 6px 2px 2px;min-height:0}
.saeulen .s small{font-size:.62rem;color:var(--muted)}
.saeulen.emo{height:auto}
.saeulen .s .e{font-size:1.1rem;height:auto}
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.kal span{text-align:center;padding:6px 0;border-radius:8px;background:var(--soft);font-size:.8rem}
.kal span.per{background:#e8577c;color:#fff;font-weight:700}
.kal span.heute{outline:2px solid var(--app)}
.menue{display:flex;flex-direction:column;gap:6px}
.menue .btn{justify-content:flex-start;padding:13px 14px;cursor:pointer}
.menue input{width:20px;height:20px;accent-color:var(--app);margin:0 6px 0 0}
</style>
</head>
<body>
<script src="../shared/intro.js"></script>
<header class="kw-bar">
  <a class="kw-home" href="../" aria-label="Zurück zur Startseite der OMNIVIA Group"><img src="../shared/marken/omnivia-zeichen.webp" alt="" width="40" height="21" style="width:40px;height:auto;display:block"></a>
  <h1>FIDELIA Health</h1>
  <button class="kw-install" id="kwInstall" type="button" hidden>Als App installieren</button>
  <button class="kw-ico" id="knopfSperren" type="button" aria-label="Sperren" hidden>🔒</button>
  <button class="kw-ico" id="knopfEinst" type="button" aria-label="Einstellungen" hidden>⚙️</button>
</header>
<span id="sperre" hidden></span>
<main class="kw-main"><div id="ansicht"></div></main>
<dialog class="sheet" id="fenster"><div class="sheet-in" id="fensterIn"></div></dialog>
<footer class="kw-foot"><span>Eine App von <a href="../apps/">FIDELIA Digital</a> · Mit deiner PIN verschlüsselt, nur auf diesem Gerät · Ein Tagebuch, kein Arzt.</span></footer>
<script src="../shared/kw.js"></script>
<script src="health.js"></script>
</body>
</html>
