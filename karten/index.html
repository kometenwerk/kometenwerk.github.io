<!doctype html>
<html lang="de" data-marke="fidelia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OMNIVIA Karten</title>
<meta name="description" content="Karte und Navi für Südbaden: eigener Routenplaner für Auto, Fahrrad und zu Fuß, Suche bis zur Hausnummer, Baustellen und Staus auf der Autobahn. Ohne Werbung, ohne Tracking.">
<meta name="theme-color" content="#4338ca">
<link rel="canonical" href="https://kometenwerk.github.io/karten/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karten">
<link rel="stylesheet" href="../shared/fonts/fonts.css">
<link rel="stylesheet" href="../shared/kw.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>:root{--app:#4338ca;--app-soft:rgba(67,56,202,.14)}</style>
<link rel="stylesheet" href="karten.css">
</head>
<body>
<script src="../shared/intro.js"></script>
<header class="kw-bar">
  <a class="kw-home" href="../" aria-label="Zurück zur OMNIVIA-Startseite"><img src="../shared/marken/omnivia-zeichen.webp" alt="" width="40" height="21" style="width:40px;height:auto;display:block"></a>
  <h1>OMNIVIA Karten</h1>
  <span id="kwBarExtra" style="display:contents"></span>
  <button class="kw-install" id="kwInstall" type="button" hidden>Als App installieren</button>
</header>

<main class="kk">
  <div id="karte" class="kk-karte" role="region" aria-label="Karte"></div>

  <div class="kk-suche">
    <form id="suchForm" class="kk-suchfeld card" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <label class="vh" for="q">Ort, Straße oder Ziel suchen</label>
      <input id="q" type="search" placeholder="Wohin? Ort, Straße, Hausnummer …" enterkeyhint="search">
      <button type="button" class="kk-x" id="qWeg" aria-label="Suche leeren" hidden>×</button>
    </form>
    <ul id="treffer" class="kk-treffer card" role="listbox" aria-label="Suchergebnisse" hidden></ul>
  </div>

  <div class="kk-knoepfe">
    <button type="button" class="kk-rund" id="standortKnopf" aria-label="Mein Standort"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2"/></svg></button>
    <button type="button" class="kk-rund" id="verkehrKnopf" aria-label="Baustellen und Staus zeigen" aria-pressed="true"><span aria-hidden="true">🚧</span></button>
  </div>

  <section id="blatt" class="kk-blatt card" aria-live="polite">
    <button type="button" class="kk-griff" id="griff" aria-label="Fenster größer oder kleiner"><span></span></button>
    <div id="blattInhalt"></div>
  </section>
</main>

<script src="../shared/kw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
