name: Feed holen
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "feed/quellen.json"
      - "feed/holen.py"
permissions:
  contents: write
concurrency:
  group: feed-holen
  cancel-in-progress: false
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Feeds laden
        run: python3 feed/holen.py
      - name: Speichern
        run: |
          git config user.name "OMNIVIA Feed"
          git config user.email "feed@users.noreply.github.com"
          git add feed/daten/feeds.json
          if git diff --cached --quiet; then echo "Nichts Neues"; exit 0; fi
          git commit -m "Feed: neue Artikel"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
